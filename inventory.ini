# Inventory of RHEL and Ubuntu hosts to run Grafana Alloy on.
# ansible_user is set per host because RHEL AMIs log in as ec2-user while
# Ubuntu AMIs log in as ubuntu.
[alloy_nodes]
# rhel-1     ansible_host=10.0.0.11 ansible_user=ec2-user
# rhel-2     ansible_host=10.0.0.12 ansible_user=ec2-user
# ubuntu-1   ansible_host=10.0.0.50 ansible_user=ubuntu
