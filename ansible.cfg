[defaults]
inventory = inventory.ini
roles_path = roles
collections_path = collections
host_key_checking = False
retry_files_enabled = False
# Reads the Vault passphrase from a git-ignored file so runs don't need
# --ask-vault-pass. Delete this line to force interactive prompts instead.
vault_password_file = .vault_pass

[privilege_escalation]
become = True
become_method = sudo
