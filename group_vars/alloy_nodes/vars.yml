---
# Let Ansible discover the right interpreter per distro: /usr/libexec/platform-
# python on RHEL (where the dnf bindings live) and /usr/bin/python3 on Ubuntu.
# Both RHEL 8 and Ubuntu 18.04 ship Python 3.6, so the control node must run
# ansible-core 2.16.x (the last release supporting Python 3.6 managed nodes).
ansible_python_interpreter: auto

# --- Package source --------------------------------------------------------
# Alloy version to install. Use the bare version with NO leading "v": the role
# builds its download URL as .../download/v{{ alloy_version }}/ and compares
# this string against `alloy --version` output, so "v1.18.0" breaks both.
# "latest" makes the role query api.github.com from the control node, which
# fails on an air-gapped control node — pin it.
alloy_version: "1.18.0"

# When alloy_yum_baseurl is set (in the git-ignored local.yml), RHEL hosts
# install Alloy from that internal repo instead of downloading the RPM from
# GitHub. Leave it unset to keep the role's direct-URL install.
#
# Grafana ships the GitHub release RPMs unsigned — `rpm -qpi` reports
# "Signature: (none)", which is also why the upstream role hardcodes
# disable_gpg_check: true. So gpgcheck stays off unless you re-sign the RPM
# with your own key and publish that pubkey as alloy_yum_gpgkey.
alloy_yum_repo_name: "local-alloy"
alloy_yum_gpgcheck: false
alloy_yum_gpgkey: ""

# --- Readiness check -------------------------------------------------------
# After install, the playbook polls Alloy's /-/ready endpoint until it returns
# 200. Total wait = alloy_ready_retries * alloy_ready_delay seconds. Increase
# these for slow hosts or where remotecfg pulls a large pipeline on startup.
alloy_ready_check_address: "127.0.0.1"
alloy_ready_check_port: 12345
alloy_ready_retries: 30
alloy_ready_delay: 10

# The upstream role's own readiness check defaults to honoring the proxy, which
# breaks a localhost check on hosts behind a corporate proxy. Bypass it.
alloy_readiness_check_use_proxy: false

# --- remotecfg (Grafana Cloud Fleet Management) settings -------------------
# The Fleet Management endpoint for your stack. The real value is kept out of
# version control: set fleet_management_url in the git-ignored local.yml (see
# group_vars/alloy_nodes/local.yml.example). Not a secret, just deployment-
# specific.
alloy_remotecfg_url: "{{ fleet_management_url }}"

# How often each collector polls for updated configuration.
alloy_remotecfg_poll_frequency: "60s"

# Basic-auth username is your Fleet Management instance/stack ID (numeric).
# The password is an Access Policy token with fleet-management:read scope.
# Keep the real token in the vault file (group_vars/alloy_nodes/vault.yml),
# NOT here. These reference the vaulted values.
#
# The token is never rendered into config.alloy — it reaches Alloy through the
# systemd env file below and is read back with sys.env(). See alloy_config.
alloy_remotecfg_username: "{{ vault_alloy_remotecfg_username }}"
alloy_remotecfg_password: "{{ vault_alloy_remotecfg_password }}"

# --- Alloy systemd env file ------------------------------------------------
# Written by the role to /etc/default/alloy (Ubuntu) and /etc/sysconfig/alloy
# (RHEL) and loaded by the alloy.service unit as environment variables. This is
# the single place the token lands on disk, and a post_task locks the file to
# 0600 (config.alloy stays 0644 but no longer holds a secret).
#
# GCLOUD_RW_API_KEY serves both auth paths:
#   - config-plane: the remotecfg basic_auth password below
#   - data-plane:   the Fleet-Management-delivered pipeline's remote_write creds
# If your write token differs from the fleet-management:read token, add a second
# entry here (e.g. GCLOUD_FM_API_KEY) and point remotecfg's sys.env() at it.
alloy_env_file_vars:
  GCLOUD_RW_API_KEY: "{{ alloy_remotecfg_password }}"

# --- Rendered Alloy configuration passed to the role -----------------------
# The remotecfg block bootstraps the collector: it registers with Fleet
# Management using its hostname as the identifier, then pulls the rest of its
# pipeline (scrapes, remote_write, etc.) from the server.
#
# The basic_auth password is read at runtime from the systemd env file with
# sys.env() rather than templated in, so no credential is written to
# /etc/alloy/config.alloy. Rotating the token is then an env-file change only.
alloy_config: |
  logging {
    level  = "info"
    format = "logfmt"
  }

  remotecfg {
    url = "{{ alloy_remotecfg_url }}"

    basic_auth {
      username = "{{ alloy_remotecfg_username }}"
      password = sys.env("GCLOUD_RW_API_KEY")
    }

    id             = constants.hostname
    poll_frequency = "{{ alloy_remotecfg_poll_frequency }}"

    attributes = {
  {% for key, value in (alloy_remotecfg_attributes | default({})).items() %}
      "{{ key }}" = "{{ value }}",
  {% endfor %}
    }
  }
