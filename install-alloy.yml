---
- name: Install and configure Grafana Alloy with remotecfg on RHEL and Ubuntu
  hosts: alloy_nodes
  become: true

  pre_tasks:
    # The role installs Alloy with the apt module on Debian/Ubuntu, which needs
    # the python3-apt bindings for whatever interpreter Ansible uses. Ensure
    # them with `raw` (no Python deps) before any apt-based task runs. Harmless
    # no-op if already present.
    - name: Ensure python3-apt is present (Debian/Ubuntu)
      ansible.builtin.raw: |
        set -e
        if ! dpkg -s python3-apt >/dev/null 2>&1; then
          apt-get update -qq && apt-get install -y python3-apt
        fi
      when: ansible_facts['os_family'] == 'Debian'
      changed_when: false

    - name: Ensure this is a supported OS family (RedHat or Debian)
      ansible.builtin.assert:
        that:
          - ansible_facts['os_family'] in ['RedHat', 'Debian']
        fail_msg: >-
          This playbook targets RHEL and Ubuntu, but detected
          os_family={{ ansible_facts['os_family'] }}.

    # Install Alloy from an internal yum repo when one is configured, instead of
    # letting the role pull the RPM from github.com (which an air-gapped host
    # can't reach). This has to run before the role: the role's own install task
    # guards on `alloy --version` output, so once the requested version is
    # already present it skips the download entirely. Everything else the role
    # does — config, env file, systemd, service — is unaffected.
    - name: Install Alloy from the internal yum repo (RedHat)
      when:
        - ansible_facts['os_family'] == 'RedHat'
        - alloy_yum_baseurl | default('') | length > 0
      block:
        - name: Assert alloy_version is pinned when installing from a repo
          ansible.builtin.assert:
            that:
              - alloy_version != 'latest'
            fail_msg: >-
              alloy_yum_baseurl is set, so alloy_version must be a concrete
              version (e.g. "1.18.0") — "latest" can't be resolved against a
              repo and would make the role query api.github.com.

        - name: Import the internal repo signing key
          ansible.builtin.rpm_key:
            key: "{{ alloy_yum_gpgkey }}"
            state: present
          when: alloy_yum_gpgcheck | bool

        - name: Configure the internal Alloy yum repo
          ansible.builtin.yum_repository:
            name: "{{ alloy_yum_repo_name }}"
            description: Internal Grafana Alloy mirror
            baseurl: "{{ alloy_yum_baseurl }}"
            enabled: true
            gpgcheck: "{{ alloy_yum_gpgcheck | bool }}"
            gpgkey: "{{ alloy_yum_gpgkey if alloy_yum_gpgcheck | bool else omit }}"
            file: "{{ alloy_yum_repo_name }}"
            owner: root
            group: root
            mode: "0644"

        - name: Install Alloy {{ alloy_version }} from the internal repo
          ansible.builtin.dnf:
            name: "alloy-{{ alloy_version }}"
            state: present
          register: _alloy_pkg

    - name: Fail early if remotecfg settings are not configured
      ansible.builtin.assert:
        that:
          - fleet_management_url is defined
          - fleet_management_url | length > 0
          - "'XXX' not in fleet_management_url"
          - alloy_remotecfg_username is defined
          - alloy_remotecfg_username | length > 0
          - alloy_remotecfg_password is defined
          - alloy_remotecfg_password | length > 0
        fail_msg: >-
          Set fleet_management_url (see group_vars/alloy_nodes/local.yml.example)
          and the vaulted credentials (see vault.yml.example) before running.

  roles:
    - role: grafana.grafana.alloy

  post_tasks:
    # The role writes the env file 0644, but it now holds GCLOUD_RW_API_KEY.
    # Tighten it to 0600 — systemd reads EnvironmentFile as root when starting
    # the unit, so the alloy service is unaffected.
    - name: Restrict the Alloy env file (contains GCLOUD_RW_API_KEY)
      ansible.builtin.file:
        path: "{{ '/etc/sysconfig/alloy' if ansible_facts['os_family'] == 'RedHat' else '/etc/default/alloy' }}"
        owner: root
        group: root
        mode: "0600"

    # When the pre_task above upgraded the RPM but alloy_config was unchanged,
    # no role handler fires and the old binary keeps running. Restart explicitly
    # so the new version is actually live. (On a first install this is a
    # redundant restart of a service the role just started — harmless.)
    - name: Restart Alloy if the package changed
      ansible.builtin.systemd:
        name: alloy.service
        state: restarted
      when:
        - not ansible_check_mode
        - _alloy_pkg is defined
        - _alloy_pkg.changed

    # The role's built-in readiness check only allows ~40s and isn't tunable.
    # Give slow hosts more time here: poll /-/ready until 200 for up to
    # alloy_ready_retries * alloy_ready_delay seconds.
    # Poll the readiness endpoint with a local curl on the host. --noproxy '*'
    # guarantees the 127.0.0.1 check never traverses a corporate proxy, whatever
    # http_proxy/no_proxy are set to. Retries for up to
    # alloy_ready_retries * alloy_ready_delay seconds.
    - name: Wait for Alloy to report ready
      ansible.builtin.command:
        cmd: >-
          curl -s --noproxy '*' -o /dev/null -w '%{http_code}'
          http://{{ alloy_ready_check_address }}:{{ alloy_ready_check_port }}/-/ready
      register: _alloy_ready
      retries: "{{ alloy_ready_retries }}"
      delay: "{{ alloy_ready_delay }}"
      until: _alloy_ready.stdout == "200"
      changed_when: false
      when:
        - not ansible_check_mode
        - ansible_facts['os_family'] in ['RedHat', 'Debian']
