---
- name: Install and configure Grafana Alloy with remotecfg on RHEL and Ubuntu
  hosts: alloy_nodes
  become: true

  pre_tasks:
    # The role installs Alloy with the apt module on Debian/Ubuntu, which needs
    # the python3-apt bindings for whatever interpreter Ansible uses. Ensure
    # them with `raw` (no Python deps) before any apt-based task runs. Harmless
    # no-op if already present.
    - name: Ensure python3-apt is present (Debian/Ubuntu)
      ansible.builtin.raw: |
        set -e
        if ! dpkg -s python3-apt >/dev/null 2>&1; then
          apt-get update -qq && apt-get install -y python3-apt
        fi
      when: ansible_facts['os_family'] == 'Debian'
      changed_when: false

    - name: Ensure this is a supported OS family (RedHat or Debian)
      ansible.builtin.assert:
        that:
          - ansible_facts['os_family'] in ['RedHat', 'Debian']
        fail_msg: >-
          This playbook targets RHEL and Ubuntu, but detected
          os_family={{ ansible_facts['os_family'] }}.

    - name: Fail early if remotecfg settings are not configured
      ansible.builtin.assert:
        that:
          - fleet_management_url is defined
          - fleet_management_url | length > 0
          - "'XXX' not in fleet_management_url"
          - alloy_remotecfg_username is defined
          - alloy_remotecfg_username | length > 0
          - alloy_remotecfg_password is defined
          - alloy_remotecfg_password | length > 0
        fail_msg: >-
          Set fleet_management_url (see group_vars/alloy_nodes/local.yml.example)
          and the vaulted credentials (see vault.yml.example) before running.

  roles:
    - role: grafana.grafana.alloy

  post_tasks:
    # The role writes the env file 0644, but it now holds GCLOUD_RW_API_KEY.
    # Tighten it to 0600 — systemd reads EnvironmentFile as root when starting
    # the unit, so the alloy service is unaffected.
    - name: Restrict the Alloy env file (contains GCLOUD_RW_API_KEY)
      ansible.builtin.file:
        path: "{{ '/etc/sysconfig/alloy' if ansible_facts['os_family'] == 'RedHat' else '/etc/default/alloy' }}"
        owner: root
        group: root
        mode: "0600"

    # The role's built-in readiness check only allows ~40s and isn't tunable.
    # Give slow hosts more time here: poll /-/ready until 200 for up to
    # alloy_ready_retries * alloy_ready_delay seconds.
    # Poll the readiness endpoint with a local curl on the host. --noproxy '*'
    # guarantees the 127.0.0.1 check never traverses a corporate proxy, whatever
    # http_proxy/no_proxy are set to. Retries for up to
    # alloy_ready_retries * alloy_ready_delay seconds.
    - name: Wait for Alloy to report ready
      ansible.builtin.command:
        cmd: >-
          curl -s --noproxy '*' -o /dev/null -w '%{http_code}'
          http://{{ alloy_ready_check_address }}:{{ alloy_ready_check_port }}/-/ready
      register: _alloy_ready
      retries: "{{ alloy_ready_retries }}"
      delay: "{{ alloy_ready_delay }}"
      until: _alloy_ready.stdout == "200"
      changed_when: false
      when:
        - not ansible_check_mode
        - ansible_facts['os_family'] in ['RedHat', 'Debian']
